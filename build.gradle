plugins {
	// Ab Minecraft 26.1 (unobfuskiert) heisst das Plugin "net.fabricmc.fabric-loom"
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Fuer Mod-Abhaengigkeiten bei Bedarf
}

dependencies {
	// Kein "mappings"-Eintrag: 26.x ist unobfuskiert (Mojang-Namen).
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Seit 26.1 ohne "mod"-Praefix.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
				"minecraft_version": inputs.properties.minecraft_version,
				"loader_version": inputs.properties.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	// Minecraft 26.x benoetigt Java 25
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
